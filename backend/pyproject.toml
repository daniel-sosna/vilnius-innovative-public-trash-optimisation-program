[project]
name = "viptop-backend"
version = "0.1.0"
description = "FastAPI backend for the VipTop waste collection optimisation MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "mapbox-vector-tile>=2.2.0",
    "psycopg[binary]",
    "pydantic-settings",
    "requests>=2.34.2",
    "sqlalchemy",
    "uvicorn",
]

[tool.uv]
package = false
