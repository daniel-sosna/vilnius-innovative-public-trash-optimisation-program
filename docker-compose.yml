services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VIPTOP_API_PROXY_TARGET: http://backend:8000
      VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://viptop:viptop@db:5432/viptop}
      VASA_TILE_URL_TEMPLATE: ${VASA_TILE_URL_TEMPLATE}
      VASA_BIN_URL_TEMPLATE: ${VASA_BIN_URL_TEMPLATE}
      VASA_HISTORY_URL_TEMPLATE: ${VASA_HISTORY_URL_TEMPLATE}
      VASA_SCHEDULE_URL_TEMPLATE: ${VASA_SCHEDULE_URL_TEMPLATE:-https://atliekuaiksteles.vasa.lt/vasa-api/api/v1/dumpsters-schedule/{external_id}}
      BIN_SYNC_HTTP_TIMEOUT_SECONDS: ${BIN_SYNC_HTTP_TIMEOUT_SECONDS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEMO_PRODUCT_PATH: ${DEMO_PRODUCT_PATH:-ml/september-fill-predictor/product}
      DEMO_DAILY_PATH: ${DEMO_DAILY_PATH:-bin_days_20231010_20261009_enriched.csv}
      DEMO_REGISTRY_PATH: ${DEMO_REGISTRY_PATH:-bins_202610091935.csv}
      DEMO_POPULATION_PATH: ${DEMO_POPULATION_PATH:-bin_population.csv}
      DEMO_OSRM_URL: ${DEMO_OSRM_URL:-https://router.project-osrm.org}
      DEMO_OSRM_REQUEST_INTERVAL_SECONDS: ${DEMO_OSRM_REQUEST_INTERVAL_SECONDS:-1.1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./docs/agent-skills.md:/app/agent-domain/agent-skills.md:ro
      - ./docs/data-model.md:/app/agent-domain/data-model.md:ro
      - ./docs/data/bin-days-columns.md:/app/agent-domain/bin-days-columns.md:ro
      - ${VIPTOP_DATA_DIR:-./backend/data}:/app/data
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_venv:
  postgres_data:
